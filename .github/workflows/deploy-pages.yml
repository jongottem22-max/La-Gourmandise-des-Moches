# Deploys the static export (out/) to GitHub Pages.
#
# The site is served from the custom domain https://gourmandisedesmoches.fr
#   → NEXT_PUBLIC_BASE_PATH is empty and public/CNAME carries the domain,
#   which GitHub Pages picks up on deploy.
#
# NEXT_PUBLIC_SITE_URL always stays the final custom domain: canonical URLs,
# sitemap and OG tags must reference the production origin.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://gourmandisedesmoches.fr
      NEXT_PUBLIC_BASE_PATH: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on first deploy (creates the Pages site with
          # "GitHub Actions" source). Harmless once enabled.
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
