# Netlify configuration — La Gourmandise des Moches
# Docs for the team: see NETLIFY_DEPLOY.md

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Next.js App Router runtime (SSR/SSG, route handlers, image optimization on the Netlify CDN)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long-cache immutable static assets produced by the Next build
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
